###############################################################################
# Ping Identity Test - PingAccess Smoke Test (BRUNO)
#
#
# Bruno variant of the postman/newman yaml in this directory (parallel run).
# Runs the converted Bruno collection helm-tests/bruno/smoke/pingaccess;
# slug = test dir name, resolved by createBrunoCollectionConfigMap.
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz          tarball of the converted collection
#   <release>-generated.bruno-environment.json env vars scraped from *-env-vars CMs
#
###############################################################################
pingaccess-admin:
  envs:
    OPERATIONAL_MODE: "STANDALONE"
  enabled: true
  privateCert:
    generate: true
  container:
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi

pingaccess-engine:
  envs:
    OPERATIONAL_MODE: "STANDALONE"
  enabled: true
  container:
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - global-init-test.sh
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - wait-for-url.sh

  testSteps:
    - name: 01a-wait-for-pingaccess-admin
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ADMIN_PRIVATE_HOSTNAME}:${PA_ADMIN_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 01b-wait-for-pingaccess-engine
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ENGINE_PRIVATE_HOSTNAME}:${PA_ENGINE_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 02-check-pa-helm-bruno
      image: ${DEPS_REGISTRY}node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.3.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
