# This test covers AC-10: with default values (secretProviderClass.enabled=false),
# no CSI volumes, no CSI volumeMounts, and no SecretProviderClass resources are rendered.
### SECTION:PARAMETERS ###
releaseName: spc-disabled
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
### SECTION:UNEXPECTED ###
# Validate that no SecretProviderClass resource is rendered with default values
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-disabled-pingdirectory-spc
spec:
  provider: aws
---
# Validate that no CSI volume appears in the pod spec
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-disabled-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: spc-disabled-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
---
# Validate that no CSI volumeMount appears in the main container
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-disabled-pingdirectory
spec:
  template:
    spec:
      containers:
        - name: pingdirectory
          volumeMounts:
            - name: spc-disabled-pingdirectory-spc
              mountPath: /run/secrets
