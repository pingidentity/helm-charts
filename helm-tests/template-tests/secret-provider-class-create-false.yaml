# This test covers AC-2: when secretProviderClass.enabled=true but create=false,
# no SecretProviderClass resource is rendered.
### SECTION:PARAMETERS ###
releaseName: spc-create-false
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
  secretProviderClass:
    enabled: true
    create: false
    provider: aws
### SECTION:UNEXPECTED ###
# Validate that no SecretProviderClass resource is rendered when create=false
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-create-false-pingdirectory-spc
spec:
  provider: aws
