# This test covers AC-3: when secretProviderClass.enabled=true and create=false,
# the CSI volume and volumeMount are still injected into the pod spec.
# (create controls SecretProviderClass resource rendering; enabled controls auto-wire)
### SECTION:PARAMETERS ###
releaseName: spc-wire
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
  secretProviderClass:
    enabled: true
    create: false
    provider: aws
### SECTION:EXPECTED ###
# Validate that the CSI volume is present in the pod spec volumes even when create=false
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-wire-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: spc-wire-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: spc-wire-pingdirectory-spc
---
# Validate that the main container has the CSI volumeMount
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-wire-pingdirectory
spec:
  template:
    spec:
      containers:
        - name: pingdirectory
          volumeMounts:
            - name: spc-wire-pingdirectory-spc
              mountPath: /run/secrets
              readOnly: true
