# This test covers AC-8: a product-level secretProviderClass.name override takes precedence
# over the default <release>-<product>-spc naming convention.
# Both the SecretProviderClass resource name and the volumeAttributes.secretProviderClass
# field must reflect the overridden name.
### SECTION:PARAMETERS ###
releaseName: spc-override
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
  secretProviderClass:
    enabled: true
    create: true
    provider: aws
    name: my-custom-spc
### SECTION:EXPECTED ###
# Validate that the SecretProviderClass resource is named my-custom-spc
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: my-custom-spc
spec:
  provider: aws
---
# Validate that the CSI volume references the overridden name
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-override-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: my-custom-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: my-custom-spc
---
# Validate that the main container volumeMount uses the overridden name
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-override-pingdirectory
spec:
  template:
    spec:
      containers:
        - name: pingdirectory
          volumeMounts:
            - name: my-custom-spc
              mountPath: /run/secrets
              readOnly: true
