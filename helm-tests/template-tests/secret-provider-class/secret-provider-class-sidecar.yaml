# This test covers AC-6: when utilitySidecar.enabled=true and secretProviderClass.enabled=true,
# the utility sidecar's volumeMounts includes the CSI volume mount.
### SECTION:PARAMETERS ###
releaseName: spc-sidecar
skipTest: false
### SECTION:VALUES ###
pingdataconsole:
  enabled: true
  utilitySidecar:
    enabled: true
  secretProviderClass:
    enabled: true
    create: false
### SECTION:EXPECTED ###
# Validate that the utility sidecar container has the CSI volumeMount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spc-sidecar-pingdataconsole
spec:
  template:
    spec:
      containers:
        - name: utility-sidecar
          volumeMounts:
            - name: spc-sidecar-pingdataconsole-spc
              mountPath: /run/secrets
              readOnly: true
