# This test covers AC-1: when secretProviderClass.enabled=true and create=true with provider=aws,
# a SecretProviderClass resource is rendered with the correct apiVersion, kind, name, and spec.provider.
### SECTION:PARAMETERS ###
releaseName: spc-enabled
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
  secretProviderClass:
    enabled: true
    create: true
    provider: aws
    parameters:
      objects: |
        - objectName: "my-secret"
          objectType: "secretsmanager"
### SECTION:EXPECTED ###
# Validate that the SecretProviderClass resource is rendered with the correct fields
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-enabled-pingdirectory-spc
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "my-secret"
        objectType: "secretsmanager"
---
# Validate that the StatefulSet has the CSI volume injected
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-enabled-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: spc-enabled-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: spc-enabled-pingdirectory-spc
---
# Validate that the main container has the CSI volumeMount
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-enabled-pingdirectory
spec:
  template:
    spec:
      containers:
        - name: pingdirectory
          volumeMounts:
            - name: spc-enabled-pingdirectory-spc
              mountPath: /run/secrets
              readOnly: true
