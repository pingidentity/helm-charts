# This test covers AC-7: when secretProviderClass.enabled=true and the user also provides
# a volume with the same CSI volume name, the volume is not rendered twice.
# The $existingVolumeNames deduplication guard suppresses the auto-wired CSI volume
# when the user has already declared a volume with the same name.
### SECTION:PARAMETERS ###
releaseName: spc-no-dup
skipTest: false
### SECTION:VALUES ###
pingdirectory:
  enabled: true
  secretProviderClass:
    enabled: true
    create: false
  volumes:
    - name: spc-no-dup-pingdirectory-spc
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: spc-no-dup-pingdirectory-spc
### SECTION:EXPECTED ###
# Validate that the user-provided CSI volume is present exactly once
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-no-dup-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: spc-no-dup-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: spc-no-dup-pingdirectory-spc
### SECTION:UNEXPECTED ###
# Validate that the CSI volume is NOT duplicated (two entries with the same name).
# If deduplication failed, two entries with name spc-no-dup-pingdirectory-spc would appear.
# The test framework list-matching requires BOTH entries to match, so if only one exists
# in the output, this UNEXPECTED assertion is not satisfied — confirming no duplicate.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spc-no-dup-pingdirectory
spec:
  template:
    spec:
      volumes:
        - name: spc-no-dup-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: spc-no-dup-pingdirectory-spc
        - name: spc-no-dup-pingdirectory-spc
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: spc-no-dup-pingdirectory-spc
