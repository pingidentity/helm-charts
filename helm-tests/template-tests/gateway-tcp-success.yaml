# Verify mixed HTTPRoute and TCPRoute rendering, parentRef sectionName injection, and metadata parity.

### SECTION:PARAMETERS ###
releaseName: gatewaytcpsuccess
skipTest: false
### SECTION:VALUES ###
global:
  gateway:
    enabled: true
    parentRefs:
    - name: shared-gateway
      namespace: infra
      group: gateway.networking.k8s.io
      kind: Gateway
    - name: secondary-gateway
      namespace: infra
  annotations:
    example.com/product-annotation: product
pingdirectory:
  enabled: true
  labels:
    example.com/product-label: "true"
  gateway:
    annotations:
      example.com/gateway-annotation: gateway
    hosts:
    - host: pingdirectory._defaultDomain_
      paths:
      - path: /
        pathType: PathPrefix
        backend:
          serviceName: https
    tcpRoutes:
    - name: ldaps
      sectionName: ldaps-1636
      backend:
        serviceName: ldaps
### SECTION:EXPECTED ###
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatewaytcpsuccess-pingdirectory
  labels:
    example.com/product-label: "true"
  annotations:
    example.com/product-annotation: product
    example.com/gateway-annotation: gateway
spec:
  parentRefs:
  - name: shared-gateway
    namespace: infra
    group: gateway.networking.k8s.io
    kind: Gateway
  - name: secondary-gateway
    namespace: infra
  hostnames:
  - pingdirectory.gatewaytcpsuccess.example.com
  rules:
  - backendRefs:
    - name: gatewaytcpsuccess-pingdirectory
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: gatewaytcpsuccess-pingdirectory-ldaps
  labels:
    example.com/product-label: "true"
  annotations:
    example.com/product-annotation: product
    example.com/gateway-annotation: gateway
spec:
  parentRefs:
  - name: shared-gateway
    namespace: infra
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: ldaps-1636
  - name: secondary-gateway
    namespace: infra
    sectionName: ldaps-1636
  rules:
  - backendRefs:
    - name: gatewaytcpsuccess-pingdirectory
      port: 636
### SECTION:UNEXPECTED ###
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: gatewaytcpsuccess-pingdirectory-global-ldaps
