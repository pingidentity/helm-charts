###############################################################################
# Ping Identity Test - PingDirectory Replication Integration Test (BRUNO)
#
#
# Bruno variant of the postman/newman yaml in this directory (parallel run).
# Runs the converted Bruno collection helm-tests/bruno/integration/pd-replicated;
# slug = test dir name, resolved by createBrunoCollectionConfigMap.
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz          tarball of the converted collection
#   <release>-generated.bruno-environment.json env vars scraped from *-env-vars CMs
#
###############################################################################
pingdirectory:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: baseline/pingdirectory
  container:
    replicaCount: 2
  services:
    https:
      containerPort: 1443
      clusterService: true

###############################################################################
# Test Steps
###############################################################################
testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - wait-for-url.sh
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - global-init-test.sh
  testSteps:
    - name: 01-wait-for-pingdirectory-0
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}-0.${PD_ENGINE_PRIVATE_HOSTNAME}-cluster:1443/available-state
        - "900"

    - name: 01-wait-for-pingdirectory-1
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}-1.${PD_ENGINE_PRIVATE_HOSTNAME}-cluster:1443/available-state
        - "900"

    - name: 02-get-dse
      image: ${DEPS_REGISTRY}pingidentity/ldap-sdk-tools:latest
      command:
        - /bin/sh
        - -c
        - ldapsearch --baseDN "" --hostname $PD_ENGINE_PRIVATE_HOSTNAME --port $PD_ENGINE_PRIVATE_PORT_LDAPS --useSSL --trustAll --scope base "(&)"

    - name: 03-check-directory-bruno
      image: ${DEPS_REGISTRY}node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.3.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
