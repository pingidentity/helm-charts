###############################################################################
# Ping Identity Test - PingAccess/PingFederate/PingDirectory FIPS Integration Test (BRUNO)
#
#
# Bruno variant of the postman/newman yaml in this directory (parallel run).
# Runs the converted Bruno collection helm-tests/bruno/integration/pa-pf-pd-fips;
# slug = test dir name, resolved by createBrunoCollectionConfigMap.
#
# ConfigMap assets (uploaded by run_helm_tests.sh):
#   <release>-bruno-collection.tar.gz          tarball of the converted collection
#   <release>-generated.bruno-environment.json env vars scraped from *-env-vars CMs
#
###############################################################################
httpcan:
  enabled: true
  containerPort: 8080
  service:
    name: httpcan
    port: 80
    targetPort: 8080

pingdirectory:
  container:
    resources:
      requests:
        cpu: 2
        memory: 4Gi
      limits:
        cpu: 2
        memory: 4Gi
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: FIPS-integration/pingdirectory
    MAX_HEAP_SIZE: 2g
    FIPS_MODE_ON: "true"
    KEYSTORE_FILE: /opt/staging/.sec/private-key.pem
    KEYSTORE_TYPE: pem
    TRUSTSTORE_FILE: /opt/staging/.sec/certificate-chain.pem
    TRUSTSTORE_TYPE: pem
    CERTIFICATE_NICKNAME: server-cert

pingfederate-admin:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: FIPS-integration/pingfederate
    HSM_MODE: BCFIPS
  container:
    waitFor:
      pingdirectory:
        service: ldaps

pingfederate-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: FIPS-integration/pingfederate
    HSM_MODE: BCFIPS

pingaccess-admin:
  enabled: true
  privateCert:
    generate: true
    format: "pingaccess-fips-pem"
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: FIPS-integration/pingaccess
    FIPS_MODE_ON: "true"
  container:
    waitFor:
      pingfederate-engine:
        service: https
        timeoutSeconds: 300

pingaccess-engine:
  enabled: true
  envs:
    SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
    SERVER_PROFILE_PATH: FIPS-integration/pingaccess
    FIPS_MODE_ON: "true"
  container:
    waitFor:
      pingdirectory:
        service: ldaps

###############################################################################
# Test Steps
###############################################################################

testFramework:
  enabled: true
  testConfigMaps:
    # DEFAULTS (found in helm chart values.yaml)
    # prefix: ping-devops-test-
    # volumeMountPath: /var/run/
    files:
      - bruno-collection.tar.gz
      - generated.bruno-environment.json
      - wait-for-url.sh

  testSteps:
    - name: 01-wait-for-pingdirectory-0
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PD_ENGINE_PRIVATE_HOSTNAME}:${PD_ENGINE_PRIVATE_PORT_HTTPS}/available-state
        - "900"

    - name: 01a-wait-for-pingfederate-admin
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ADMIN_PRIVATE_HOSTNAME}:${PF_ADMIN_PRIVATE_PORT_HTTPS}/pingfederate/app
        - "900"

    - name: 01b-wait-for-pingfederate-engine
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PF_ENGINE_PRIVATE_HOSTNAME}:${PF_ENGINE_PRIVATE_PORT_HTTPS}/pf/heartbeat.ping
        - "900"

    - name: 01c-wait-for-pingaccess-admin
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ADMIN_PRIVATE_HOSTNAME}:${PA_ADMIN_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 01d-wait-for-pingaccess-engine
      image: ${DEPS_REGISTRY}pingidentity/pingtoolkit:latest
      command:
        - /bin/sh
        - /var/run/wait-for-url.sh
        - https://${PA_ENGINE_PRIVATE_HOSTNAME}:${PA_ENGINE_PRIVATE_PORT_HTTPS}/pa/heartbeat.ping
        - "900"

    - name: 02-check-pa-pf-pd-fips-bruno
      image: ${DEPS_REGISTRY}node:22-alpine
      env:
        # npm needs a writable HOME for its cache; the chart runs this container
        # as runAsUser 9031 and /var/run is the writable mount.
        - name: HOME
          value: /var/run/shared
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cd /var/run/shared
          mkdir -p bruno-collection
          tar -xzf /var/run/bruno-collection.tar.gz -C bruno-collection
          npm install @usebruno/cli@4.3.0 --silent --no-audit --no-fund --no-save
          cd bruno-collection
          ../node_modules/.bin/bru run . --env-file /var/run/generated.bruno-environment.json --insecure --output ../bru-results.json
