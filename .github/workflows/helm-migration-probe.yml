name: Helm migration probe

on:
  workflow_dispatch:
    inputs:
      run_template_tests:
        description: Run Helm template tests
        type: boolean
        required: true
        default: true
      retain_logs:
        description: Retain diagnostic logs even when the run succeeds
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: helm-migration-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Hosted runner and template probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_TEMPLATE_TESTS: ${{ inputs.run_template_tests }}
      RETAIN_LOGS: ${{ inputs.retain_logs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Create submodule GitHub App token
        id: submodule-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ping-internal
          repositories: cdi-shared-configs
          permission-contents: read

      - name: Checkout private submodule
        env:
          GH_TOKEN: ${{ steps.submodule-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # actions/checkout does not reliably pass its HTTPS extraheader into
          # private submodule clones. Use a temporary URL rewrite and always
          # remove it after the clone so the token is not retained in config.
          cleanup() {
            git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=1 --recursive

      - name: Verify submodule checkout
        run: |
          set -euo pipefail
          test -f shared-configs/README.md
          git -C shared-configs rev-parse --verify HEAD
          printf 'submodule_commit=%s\n' "$(git -C shared-configs rev-parse HEAD)"

      - name: Collect runner facts
        run: |
          set -euo pipefail
          {
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'kernel=%s\n' "$(uname -sr)"
            printf 'cpu_count=%s\n' "$(nproc)"
            printf 'disk=\n'
            df -h .
            printf 'memory=\n'
            free -h
          } | tee runner-facts.txt

      - name: Check public network reachability
        run: |
          set -euo pipefail
          : > network-reachability.txt
          for url in \
            https://api.github.com \
            https://get.helm.sh \
            https://github.com \
            https://pypi.org; do
            printf '%s ' "$url" | tee -a network-reachability.txt
            # A reachable host may return 3xx/4xx at its root; record HTTP status
            # without treating an application response as a network failure.
            curl --silent --show-error --location --max-time 15 \
              -o /dev/null -w '%{http_code}\n' "$url" | tee -a network-reachability.txt
          done

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Verify Kubernetes clients without cluster access
        run: |
          set -euo pipefail
          kubectl version --client=true
          oc version --client=true

      - name: Run template tests
        if: ${{ inputs.run_template_tests }}
        run: |
          set -o pipefail
          # The template test path is self-contained and requires no product credentials.
          ./ci_scripts/run_helm_template_tests.sh 2>&1 | tee template-tests.log

      - name: Upload diagnostic logs
        if: ${{ always() && (inputs.retain_logs || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: helm-migration-probe-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            runner-facts.txt
            network-reachability.txt
            template-tests.log
