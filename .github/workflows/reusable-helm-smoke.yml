name: Reusable Helm smoke

on:
  workflow_call:
    inputs:
      expected_arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      retain_logs:
        required: true
        type: boolean
      job_id:
        required: true
        type: string
      cluster_name:
        description: EKS cluster the smoke tests deploy into
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: PingDataConsole smoke (${{ inputs.expected_arch }})
    runs-on: ${{ inputs.runner }}
    environment: helm-test
    timeout-minutes: 45
    env:
      EXPECTED_ARCH: ${{ inputs.expected_arch }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_REF_SLUG: helm-ci
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}
      CI_PIPELINE_ID: ${{ github.run_id }}
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_JOB_ID: ${{ inputs.job_id }}
      PING_IDENTITY_DEVOPS_USER: ${{ vars.PING_IDENTITY_DEVOPS_USER }}
      PING_IDENTITY_DEVOPS_KEY: ${{ secrets.PING_IDENTITY_DEVOPS_KEY }}
      PIPELINE_BUILD_REGISTRY: ${{ vars.PIPELINE_BUILD_REGISTRY }}
      PIPELINE_BUILD_REGISTRY_VENDOR: ${{ vars.PIPELINE_BUILD_REGISTRY_VENDOR }}
      PIPELINE_BUILD_REPO: ${{ vars.PIPELINE_BUILD_REPO }}
      PIPELINE_DEPS_REGISTRY: ${{ vars.PIPELINE_DEPS_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Create submodule GitHub App token
        id: submodule-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ping-internal
          repositories: cdi-shared-configs
          permission-contents: read

      - name: Checkout private submodule
        env:
          GH_TOKEN: ${{ steps.submodule-app-token.outputs.token }}
        run: |
          set -euo pipefail
          cleanup() {
            git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=1 --recursive

      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual_arch=$(uname -m)
          case "${EXPECTED_ARCH}:${actual_arch}" in
            x86_64:x86_64|aarch64:aarch64|aarch64:arm64) ;;
            *) echo "Expected ${EXPECTED_ARCH}, got ${actual_arch}" >&2; exit 1 ;;
          esac
          printf 'runner=%s\narchitecture=%s\n' "$RUNNER_NAME" "$actual_arch"

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Materialize AWS compatibility files
        env:
          AWS_CREDENTIALS_CONTENT: ${{ secrets.AWS_SHARED_CREDENTIALS_FILE }}
          AWS_CONFIG_CONTENT: ${{ secrets.AWS_CONFIG_FILE }}
        run: |
          set -euo pipefail
          test -n "${AWS_CREDENTIALS_CONTENT}" || { echo 'Missing AWS_SHARED_CREDENTIALS_FILE'; exit 1; }
          test -n "${AWS_CONFIG_CONTENT}" || { echo 'Missing AWS_CONFIG_FILE'; exit 1; }
          umask 077
          credentials_file="$RUNNER_TEMP/aws-credentials"
          config_file="$RUNNER_TEMP/aws-config"
          printf '%s\n' "${AWS_CREDENTIALS_CONTENT}" > "$credentials_file"
          printf '%s\n' "${AWS_CONFIG_CONTENT}" > "$config_file"
          {
            printf 'AWS_SHARED_CREDENTIALS_FILE=%s\n' "$credentials_file"
            printf 'AWS_CONFIG_FILE=%s\n' "$config_file"
          } >> "$GITHUB_ENV"
          unset AWS_CREDENTIALS_CONTENT AWS_CONFIG_CONTENT

      - name: Configure test cluster access
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${AWS_REGION}" --kubeconfig "${KUBECONFIG}"
          kubectl version
          kubectl config current-context
          printf 'KUBECONFIG=%s\n' "${KUBECONFIG}" >> "${GITHUB_ENV}"

      - name: Verify smoke prerequisites
        run: |
          set -euo pipefail
          test -n "${PING_IDENTITY_DEVOPS_USER}" || { echo 'Missing PING_IDENTITY_DEVOPS_USER'; exit 1; }
          test -n "${PING_IDENTITY_DEVOPS_KEY}" || { echo 'Missing PING_IDENTITY_DEVOPS_KEY'; exit 1; }
          test -n "${PIPELINE_BUILD_REGISTRY}" || { echo 'Missing PIPELINE_BUILD_REGISTRY'; exit 1; }
          test -n "${PIPELINE_DEPS_REGISTRY}" || { echo 'Missing PIPELINE_DEPS_REGISTRY'; exit 1; }
          test -s "${AWS_SHARED_CREDENTIALS_FILE}" || { echo 'AWS credentials file is empty'; exit 1; }
          test -s "${AWS_CONFIG_FILE}" || { echo 'AWS config file is empty'; exit 1; }
          test "$(kubectl auth can-i create namespaces)" = yes || {
            echo 'Runner service account cannot create namespaces'; exit 1;
          }

      - name: Run PingDataConsole smoke
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            printf 'smoke_attempt=%s\n' "$attempt" | tee -a "smoke-${EXPECTED_ARCH}.log"
            if ./ci_scripts/run_helm_smoke.sh --product pingdataconsole 2>&1 | tee -a "smoke-${EXPECTED_ARCH}.log"; then
              exit 0
            fi
            test "$attempt" -lt 3 && sleep 10
          done
          exit 1

      - name: Capture smoke diagnostics
        if: ${{ always() }}
        run: |
          kubectl get pods -o wide > "pods-${EXPECTED_ARCH}.txt" || true
          kubectl get events --sort-by=.lastTimestamp > "events-${EXPECTED_ARCH}.txt" || true

      - name: Clean up smoke namespace
        if: ${{ always() }}
        run: |
          namespace="dbt-${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-${CI_JOB_ID}-1"
          kubectl delete namespace "${namespace}" --ignore-not-found=true --wait=false || true

      - name: Remove AWS compatibility files
        if: ${{ always() }}
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: rm -f "${AWS_SHARED_CREDENTIALS_FILE}" "${AWS_CONFIG_FILE}" "${KUBECONFIG}"

      - name: Upload smoke diagnostics
        if: ${{ always() && (inputs.retain_logs || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: helm-test-${{ inputs.expected_arch }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            smoke-${{ inputs.expected_arch }}.log
            namespaces-${{ inputs.expected_arch }}.txt
            pods-${{ inputs.expected_arch }}.txt
            events-${{ inputs.expected_arch }}.txt
