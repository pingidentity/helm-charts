name: Helm tests

# Test pipeline for the ping-devops chart, mirroring the GitLab CI stages
# (initialization/test.template/test.smoke/test.integration) with GitHub
# Actions needs-gating:
#
#   lint -> template -> smoke (parallel, both arches) -> integration (parallel, both arches)
#
# Stage gate: a stage runs only if every job of the previous stage succeeded
# (needs:). A lint or smoke failure skips everything downstream, exactly like
# the GitLab initialization stage running first.
#
# Triggers:
#  - pull_request -> Lint + Template tests (Template tests is the org
#    ruleset's required check).
#  - push to master -> FULL parity with the GitLab master pipeline:
#    lint -> template -> 11 smoke products x2 arch -> 5 integration suites x2 arch.
#  - schedule (07:00 America/Chicago Mon/Wed/Fri) -> canary: lint ->
#    template -> pingdataconsole smoke x2 arch. Catches runner/registry/
#    credential rot between merges; not a coverage run.
#  - workflow_dispatch -> per-toggle inputs (lint, template, smoke per arch,
#    integration per arch) for targeted runs.
#
# The lint job reproduces GitLab's intel.i.chartlinter (helm lint on the
# chart) and intel.i.shfmt (shfmt --diff, run unconditionally rather than
# only when ci_scripts/* changes — full coverage, ~5s on hosted runners).
#
# Not ported from GitLab: the NIGHTLY-only jobs (pa-pf-pd-fips integration +
# examples-test suites — the GitLab schedule that set NIGHTLY=true was
# inactive since 2026-01, so these were already dead in practice). The FIPS
# suite remains dispatch-runnable via the integration_test input
# (integration_test=pa-pf-pd-fips).

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    # 07:00 America/Chicago Mon/Wed/Fri (13:00 UTC during CDT).
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      run_lint:
        description: Run the lint job (helm lint + shfmt)
        type: boolean
        required: true
        default: true
      run_template_tests:
        description: Run the focused and complete template suites
        type: boolean
        required: true
        default: true
      run_smoke_x86:
        description: Run smoke (smoke_product) on the private x86 runner
        type: boolean
        required: true
        default: false
      run_smoke_arm:
        description: Run smoke (smoke_product) on the private ARM runner
        type: boolean
        required: true
        default: false
      smoke_product:
        description: Smoke product (any helm-tests/smoke-tests/<product>)
        type: string
        required: false
        default: pingdataconsole
      run_integration_x86:
        description: Run integration test on the private x86 runner
        type: boolean
        required: true
        default: false
      run_integration_arm:
        description: Run integration test on the private ARM runner
        type: boolean
        required: true
        default: false
      integration_test:
        description: Integration test family (helm-tests/integration-tests/<name>)
        type: string
        required: false
        default: pa-pf-pd
      retain_logs:
        description: Retain diagnostics on successful jobs
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: helm-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_COMMIT_REF_NAME: ${{ github.ref_name }}
  # Keep the namespace prefix DNS-safe even when the branch contains '/'.
  CI_COMMIT_REF_SLUG: helm-ci
  CI_COMMIT_SHA: ${{ github.sha }}
  CI_COMMIT_SHORT_SHA: ${{ github.sha }}
  CI_PIPELINE_ID: ${{ github.run_id }}
  CI_PROJECT_DIR: ${{ github.workspace }}
  CI_JOB_ID: ${{ github.job }}

jobs:
  lint:
    name: Lint (helm lint + shfmt)
    # Initialization-stage parity: cheapest checks first; a lint failure skips
    # the entire test pipeline (template needs lint). Runs on every PR and
    # master push, unconditionally (GitLab gated shfmt on ci_scripts/* changes
    # to save runner minutes; hosted-runner cost is ~5s, full coverage is
    # drift-proof). Not a required check yet.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_lint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: helm lint (chartlinter parity)
        run: ./ci_scripts/helm_chart_linter.sh

      - name: shfmt --diff (shell format parity)
        run: ./ci_scripts/shfmt.sh --diff

  template:
    name: Template tests
    needs: lint
    # Always run on PRs (required check must report) and master pushes (the
    # release gate: master must be green before a release tag is cut). On
    # schedule: template gates the canary smoke. Dispatch honors the input.
    # needs: lint gives the GitLab initialization-stage ordering (lint
    # failure skips template, smoke, and integration). 'skipped' lint is
    # allowed so dispatching with run_lint=false still runs the template
    # suite standalone.
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.run_template_tests) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Install template-test dependency
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/template-venv"
          "$RUNNER_TEMP/template-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2
          echo "$RUNNER_TEMP/template-venv/bin" >> "$GITHUB_PATH"

      - name: Run focused template test
        run: |
          set -o pipefail
          ./ci_scripts/test_helm_template.py test \
            --test-file helm-tests/template-tests/gateway/gateway-http-route.yaml \
            2>&1 | tee focused-template-test.log

      - name: Run complete template suite
        run: |
          set -o pipefail
          ./ci_scripts/run_helm_template_tests.sh 2>&1 | tee template-tests.log

      - name: Upload template diagnostics
        if: ${{ always() && (inputs.retain_logs || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: helm-template-tests-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            focused-template-test.log
            template-tests.log

  # --------------------------------------------------------------------
  # Smoke stage: product x arch matrix, parallel, needs-gated on template
  # (which is needs-gated on lint — the transitive chain carries the stage
  # gate from initialization through template).
  # push (merge parity): all 11 products, both arches — the GitLab master
  # pipeline's test.smoke stage. schedule (MWF canary): pingdataconsole only.
  # workflow_dispatch: the toggled arch(es) for the chosen product.
  # --------------------------------------------------------------------
  smoke:
    name: Smoke ${{ matrix.product }} (${{ matrix.arch_name }})
    needs: template
    if: ${{ always() && needs.template.result == 'success' }}
    # Stage gate is carried transitively: template only reaches 'success'
    # when lint succeeded (or was dispatch-skipped), so smoke implies lint.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- schedule canary: pingdataconsole, both arches
          - { product: pingdataconsole, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: true }
          - { product: pingdataconsole, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: true }
          # ---- push parity: remaining 10 products, both arches
          - { product: pingaccess, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingaccess, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingauthorize, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingauthorize, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingauthorizepap, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingauthorizepap, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingcentral, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingcentral, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdatasync, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdatasync, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdelegator, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdelegator, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdirectory, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdirectory, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdirectoryproxy, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingdirectoryproxy, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingfederate, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingfederate, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: ldap-sdk-tools, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: ldap-sdk-tools, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingtoolkit, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
          - { product: pingtoolkit, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', on_schedule: false }
    uses: ./.github/workflows/reusable-helm-smoke.yml
    with:
      expected_arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      job_id: ${{ matrix.arch == 'x86_64' && 'x86' || 'arm' }}
      cluster_name: ${{ matrix.cluster }}
      cluster_server: ${{ matrix.server }}
      smoke_product: ${{ matrix.product }}
      retain_logs: ${{ inputs.retain_logs || false }}
      # Reusable-call job-level `if` cannot reference matrix, so per-entry
      # event filtering happens here and the reusable job skips when false.
      should_run: ${{ (github.event_name == 'push')
        || (github.event_name == 'schedule' && matrix.on_schedule)
        || (github.event_name == 'workflow_dispatch' && matrix.product == inputs.smoke_product && ((matrix.arch == 'x86_64' && inputs.run_smoke_x86) || (matrix.arch == 'aarch64' && inputs.run_smoke_arm))) }}
    secrets: inherit

  # --------------------------------------------------------------------
  # Integration stage: 5 suites x 2 arch, parallel, needs-gated on the WHOLE
  # smoke stage (stage gate: any smoke failure skips integration, matching
  # the GitLab stage ordering). The dispatch single-suite case also passes
  # through here; its if picks the requested suite+arch.
  # --------------------------------------------------------------------
  integration:
    name: Integration ${{ matrix.suite }} (${{ matrix.arch_name }})
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: pa-pf-pd, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pa-pf-pd, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: paz-pd, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: paz-pd, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pd-replicated, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pd-replicated, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pdp-pd, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pdp-pd, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pds-pd, arch: x86_64, arch_name: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com' }
          - { suite: pds-pd, arch: aarch64, arch_name: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com' }
    uses: ./.github/workflows/reusable-helm-integration.yml
    with:
      expected_arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      job_id: ${{ matrix.arch == 'x86_64' && 'x86' || 'arm' }}
      cluster_name: ${{ matrix.cluster }}
      cluster_server: ${{ matrix.server }}
      integration_test: ${{ matrix.suite }}
      test_directory: integration-tests
      helm_chart: charts/ping-devops/
      retain_logs: ${{ inputs.retain_logs || false }}
      # Same pattern as smoke: per-entry event filtering via should_run
      # (matrix is unavailable in the reusable-call job-level if).
      should_run: ${{ (github.event_name == 'push')
        || (github.event_name == 'workflow_dispatch' && matrix.suite == inputs.integration_test && ((matrix.arch == 'x86_64' && inputs.run_integration_x86) || (matrix.arch == 'aarch64' && inputs.run_integration_arm))) }}
    secrets: inherit
