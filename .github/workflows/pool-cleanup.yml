name: Pool cleanup

# Manual pool hygiene for the shared CI pool namespaces (ppds-ci-pool-0..4
# on helm-charts-runner and helm-charts-runner-arm). Pools cannot be created
# by CI, so every run claims one via GITHUB_RUN_ID % 5; resource lifecycle is
# label-based since PRs #510/#511 (ppds.pingidentity.com/release per suite,
# ppds.pingidentity.com/run-id per pipeline, >2h stale-run sweep).
#
# When to use this workflow:
#   - A run's always() cleanup never ran (runner crash, force-cancel, quota
#     kill) and its labeled leftovers are still inside the 2h stale-sweep
#     window — clean that run-id now instead of waiting.
#   - One-time removal of resources created before the labeling scheme
#     existed (they carry no labels and nothing matches them).
#
# Safety:
#   dry_run=true (default) only lists what would be deleted.
#   mode=run-id (default) touches ONLY resources labeled with the given
#     run id — safe to run while other suites are active.
#   mode=all-unlabeled sweeps every unlabeled resource (minus pool
#     fixtures). Cross-fire hazard: this is the same namespace-wide delete
#     that killed run 43328361118. Only run it when no matrix is active —
#     check https://github.com/ping-internal/ppds-helm-charts/actions
#     first. Labeled resources are never touched by this mode.
#   Scheduled runs (daily 06:00 UTC, both clusters) use all-unlabeled with
#     an activity guard: if any pool holds a resource labeled with a run-id
#     whose newest object is younger than 3h, that pool is skipped — a run
#     may be active. Stale labeled residue (>=2h) is left to the in-CI
#     stale sweep of the next run that claims the pool.
#
# Note: runs from a branch need chore/* or feature/* in the helm-test
# deployment branch policy (master is always allowed).

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Cluster to clean (x86_64 or aarch64)
        type: choice
        required: true
        options:
          - x86_64
          - aarch64
        default: x86_64
      mode:
        description: run-id = delete only the given run's resources (safe while other suites run). all-unlabeled = sweep every unlabeled resource (only when no matrix is active).
        type: choice
        required: true
        options:
          - run-id
          - all-unlabeled
        default: run-id
      run_id:
        description: GITHUB_RUN_ID whose resources to delete (mode=run-id only)
        type: string
        required: false
      dry_run:
        description: List targets without deleting
        type: boolean
        required: true
        default: true
  schedule:
    # Daily 06:00 UTC (01:00 America/Chicago) — well clear of the MWF
    # 13:00 UTC canary and typical working-hours dispatches.
    - cron: '0 6 * * *'

jobs:
  clean-pool:
    name: Clean pools (${{ inputs.arch || 'x86_64+aarch64 (scheduled)' }} / ${{ inputs.mode || 'all-unlabeled (scheduled)' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ping-internal-x86, cluster: helm-charts-runner, server: 'https://6F90538AF4A1A3064D4BFAC6FC95D48D.gr7.us-west-2.eks.amazonaws.com', ca: EKS_X86_CA }
          - { arch: aarch64, runner: ping-internal-arm, cluster: helm-charts-runner-arm, server: 'https://8FEAE34D9303428734C0216C6C33B964.gr7.us-west-2.eks.amazonaws.com', ca: EKS_ARM_CA }
    runs-on: ${{ (github.event_name == 'schedule' && matrix.runner) || (inputs.arch == 'x86_64' && 'ping-internal-x86' || 'ping-internal-arm') }}
    environment: helm-test
    permissions:
      id-token: write  # OIDC role assumption (caller must grant it too)
    env:
      EXPECTED_ARCH: ${{ github.event_name == 'schedule' && matrix.arch || inputs.arch }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ matrix.cluster }}
      EKS_SERVER: ${{ matrix.server }}
    steps:
      # No checkout: this workflow runs nothing from the repo. A checkout
      # fails auth on non-master dispatches from the private runners
      # ("could not read Username for 'https://github.com'"). The runners
      # have neither kubectl nor aws — setup-tools installs both but needs
      # a checkout; install inline with the same sources/versions.
      - name: Install kubectl + AWS CLI
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64) karch=amd64; warch=x86_64 ;;
            aarch64|arm64) karch=arm64; warch=aarch64 ;;
            *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
          esac

          AWSCLI_VERSION=2.36.41
          archive="awscli-exe-linux-${warch}-${AWSCLI_VERSION}.zip"
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/${archive}" --output "${RUNNER_TEMP}/${archive}"
          unzip -q -o "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}/awscli"
          sudo "${RUNNER_TEMP}/awscli/aws/install" --update
          aws --version

          KUBECTL_VERSION=1.36.3
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${karch}/kubectl" \
            --output "${RUNNER_TEMP}/kubectl"
          sudo install -m 0755 "${RUNNER_TEMP}/kubectl" /usr/local/bin/kubectl
          kubectl version --client
          jq --version

      - name: Assume CI role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::574076504146:role/helm-charts-ci
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure test cluster access
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          EKS_CA: ${{ vars[matrix.ca] }}
        run: |
          set -euo pipefail
          test -n "${EKS_CA}" || { echo "Missing cluster CA variable"; exit 1; }
          cat > "${KUBECONFIG}" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: ${EKS_CLUSTER}
            cluster:
              server: ${EKS_SERVER}
              certificate-authority-data: ${EKS_CA}
          users:
          - name: helm-charts-ci
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1beta1
                command: aws
                args: ["eks", "get-token", "--cluster-name", "${EKS_CLUSTER}", "--region", "${AWS_REGION}"]
                interactiveMode: Never
          contexts:
          - name: ${EKS_CLUSTER}
            context: {cluster: ${EKS_CLUSTER}, user: helm-charts-ci}
          current-context: ${EKS_CLUSTER}
          EOF
          # Step-scoped KUBECONFIG would fall back to the runner's in-cluster
          # identity (arc-runners SA, no permissions) in later steps.
          printf 'KUBECONFIG=%s\n' "${KUBECONFIG}" >> "${GITHUB_ENV}"
          kubectl version --client=false

      - name: Resolve mode
        run: |
          set -euo pipefail
          # Scheduled runs always sweep all-unlabeled, guarded below.
          if test "${{ github.event_name }}" = "schedule"; then
            echo "MODE=all-unlabeled" >> "${GITHUB_ENV}"
            echo "DRY_RUN=false" >> "${GITHUB_ENV}"
            echo "IS_SCHEDULED=true" >> "${GITHUB_ENV}"
          else
            echo "MODE=${{ inputs.mode }}" >> "${GITHUB_ENV}"
            echo "DRY_RUN=${{ inputs.dry_run }}" >> "${GITHUB_ENV}"
            echo "IS_SCHEDULED=false" >> "${GITHUB_ENV}"
          fi

      - name: Validate inputs
        run: |
          set -euo pipefail
          if test "${MODE}" = "run-id"; then
            test -n "${{ inputs.run_id }}" || { echo "mode=run-id requires run_id input"; exit 1; }
          fi

      - name: Inventory before
        run: |
          for ns in ppds-ci-pool-0 ppds-ci-pool-1 ppds-ci-pool-2 ppds-ci-pool-3 ppds-ci-pool-4; do
            echo "===== ${ns} ====="
            kubectl get all,pvc,configmap,secret -n "${ns}" || true
          done

      - name: Select targets
        run: |
          set -euo pipefail
          # Activity guard for scheduled sweeps: a pool holding a labeled
          # resource newer than 3h may have an active run in it — skip that
          # pool entirely. Unlabeled deletes inside an active pool would be
          # cross-fire (run 43328361118).
          _guardSeconds=10800
          _now=$(date +%s)
          for ns in ppds-ci-pool-0 ppds-ci-pool-1 ppds-ci-pool-2 ppds-ci-pool-3 ppds-ci-pool-4; do
            if test "${IS_SCHEDULED}" = "true"; then
              _newest=$(kubectl get pod,sts,deploy,replicaset,statefulset,pvc,configmap,secret,service \
                -n "${ns}" -l ppds.pingidentity.com/run-id -o json 2>/dev/null \
                | jq -r '[.items[].metadata.creationTimestamp] | max // empty')
              if test -n "${_newest}"; then
                if test "$(uname -s)" = "Darwin"; then
                  _epoch=$(date -j -f "%Y-%m-%dT%TZ" "${_newest}" "+%s" 2>/dev/null || echo 0)
                else
                  _epoch=$(date -d "${_newest}" +%s 2>/dev/null || echo 0)
                fi
                _age=$(( ${_now} - ${_epoch} ))
                if test ${_age} -lt ${_guardSeconds}; then
                  echo "SKIPPING ${ns}: newest labeled resource is ${_age}s old (<${_guardSeconds}s guard) — possible active run"
                  echo "${ns}" >> skipped-pools.txt
                  continue
                fi
              fi
            fi
            echo "${ns}" >> candidate-pools.txt
          done

          : > targets.txt
          for ns in $(cat candidate-pools.txt 2>/dev/null); do
            if test "${MODE}" = "run-id"; then
              # Everything labeled with the given run id, all candidate pools.
              # Kubernetes label values must be alphanumeric/-/./_ — GITHUB_RUN_ID is.
              # Note: services carry no run-id label (kubectl label is not
              # applied to them), so run-id mode never matches them.
              kubectl get pod,sts,deploy,replicaset,statefulset,pvc,configmap,secret \
                -n "${ns}" -l "ppds.pingidentity.com/run-id=${{ inputs.run_id }}" -o json 2>/dev/null \
                | jq -r '.items[] | "\(.metadata.namespace) \(.kind)/\(.metadata.name)"' >> targets.txt
            else
              # All unlabeled, minus pool fixtures and k8s-managed objects.
              # Includes services: dead runs' chart services carry no ppds
              # labels, so they linger forever otherwise. Endpoints and
              # EndpointSlices are garbage-collected with their service.
              kubectl get pod,sts,deploy,replicaset,statefulset,pvc,configmap,secret,service \
                -n "${ns}" -o json 2>/dev/null \
                | jq -r '.items[]
                    | select(
                        (.metadata.labels["ppds.pingidentity.com/run-id"] == null)
                        and (.metadata.name != "aws-ecr-registry")
                        and (.metadata.name != "default")
                        and (.metadata.name != "kube-root-ca.crt")
                      )
                    | "\(.metadata.namespace) \(.kind)/\(.metadata.name)"' >> targets.txt
            fi
          done

          echo "=== targets ($(wc -l < targets.txt | tr -d ' ')) ==="
          cat targets.txt
          if test -s skipped-pools.txt; then
            echo "=== skipped pools (activity guard) ==="
            cat skipped-pools.txt
          fi

      - name: Delete targets
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          test -s targets.txt || { echo "nothing to delete"; exit 0; }
          while read -r ns res; do
            test -z "${ns}" && continue
            echo "deleting ${res} in ${ns}"
            kubectl delete "${res}" -n "${ns}" --ignore-not-found=true --wait=false
          done < targets.txt

      - name: Inventory after
        if: always()
        run: |
          for ns in ppds-ci-pool-0 ppds-ci-pool-1 ppds-ci-pool-2 ppds-ci-pool-3 ppds-ci-pool-4; do
            echo "===== ${ns} ====="
            kubectl get all,pvc,configmap,secret -n "${ns}" || true
          done
