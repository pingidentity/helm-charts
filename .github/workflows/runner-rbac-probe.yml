name: Runner Kubernetes RBAC probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to inspect
        type: choice
        required: true
        default: ping-internal-x86-k8s
        options:
          - ping-internal-x86-k8s
          - ping-internal-arm-k8s
          - ping-internal-x86
          - ping-internal-arm

permissions:
  contents: read

jobs:
  probe:
    name: Inspect ${{ inputs.runner }} Kubernetes permissions
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Inspect runner and Kubernetes identity
        run: |
          set -euo pipefail
          printf 'runner=%s\narchitecture=%s\n' "$RUNNER_NAME" "$(uname -m)"
          kubectl version --client=true
          kubectl config current-context
          kubectl auth whoami 2>/dev/null || true
          for permission in \
            'create namespaces' \
            'delete namespaces' \
            'list namespaces' \
            'create pods' \
            'list pods' \
            'create deployments' \
            'create services' \
            'create secrets' \
            'create configmaps' \
            'create persistentvolumeclaims' \
            'list events'; do
            resource=${permission#* }
            verb=${permission%% *}
            printf '%-5s %-28s ' "$verb" "$resource"
            kubectl auth can-i "$verb" "$resource" || true
          done
