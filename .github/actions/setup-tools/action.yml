name: Set up Helm test tools
description: Install and verify the tools needed by Helm validation on GitHub-hosted Ubuntu runners
inputs:
  helm-version:
    description: Helm version to install when Helm is unavailable or mismatched
    required: false
    default: '4.2.4'
  shfmt-version:
    description: shfmt release version to install when shfmt is unavailable
    required: false
    default: '3.13.1'
  shellcheck-version:
    description: shellcheck release version to install when shellcheck is unavailable
    required: false
    default: '0.11.0'
runs:
  using: composite
  steps:
    - name: Install base packages
      shell: bash
      run: |
        set -euo pipefail
        echo 'setup-tools: checking base packages'
        missing=()
        for package in jq gettext-base libxml2-utils; do
          case "$package" in
            jq) command_name=jq ;;
            gettext-base) command_name=envsubst ;;
            libxml2-utils) command_name=xmllint ;;
          esac
          command -v "$command_name" >/dev/null 2>&1 || missing+=("$package")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "setup-tools: installing base packages: ${missing[*]}"
          timeout 180s sudo apt-get update -o Acquire::Retries=2
          timeout 180s sudo apt-get install --no-install-recommends -y "${missing[@]}"
        else
          echo 'setup-tools: base packages already available'
        fi
        echo 'setup-tools: base packages complete'

    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking Helm ${HELM_VERSION}"
        if command -v helm >/dev/null 2>&1 && helm version --template '{{.Version}}' 2>/dev/null | grep -q "v${HELM_VERSION}$"; then
          echo 'setup-tools: Helm already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive="helm-v${HELM_VERSION}-linux-${arch}.tar.gz"
        echo "setup-tools: downloading ${archive}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://get.helm.sh/${archive}" --output "$RUNNER_TEMP/$archive"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/linux-${arch}/helm" /usr/local/bin/helm
        helm version
        echo 'setup-tools: Helm complete'

    - name: Install shellcheck
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking ShellCheck ${SHELLCHECK_VERSION}"
        if command -v shellcheck >/dev/null 2>&1; then
          echo 'setup-tools: ShellCheck already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive="shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
        echo "setup-tools: downloading ${archive}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
          --output "$RUNNER_TEMP/$archive"
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        shellcheck --version | sed -n '1,2p'
        echo 'setup-tools: ShellCheck complete'

    - name: Install shfmt
      shell: bash
      env:
        SHFMT_VERSION: ${{ inputs.shfmt-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking shfmt ${SHFMT_VERSION}"
        if command -v shfmt >/dev/null 2>&1; then
          echo 'setup-tools: shfmt already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        echo "setup-tools: downloading shfmt for ${arch}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_${arch}" \
          --output "$RUNNER_TEMP/shfmt"
        sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
        shfmt --version
        echo 'setup-tools: shfmt complete'

    - name: Report tool versions
      shell: bash
      run: |
        set -euo pipefail
        printf 'architecture=%s\n' "$(uname -m)"
        printf 'helm='; helm version --template '{{.Version}}'; printf '\n'
        printf 'shellcheck='; shellcheck --version | awk -F: '/version:/ {gsub(/ /, "", $2); print $2; exit}'
        printf 'shfmt='; shfmt --version
        printf 'jq='; jq --version
        printf 'python='; python3 --version
