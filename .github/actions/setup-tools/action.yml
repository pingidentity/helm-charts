name: Set up Helm test tools
description: Install and verify the tools needed by Helm validation on GitHub-hosted Ubuntu runners
inputs:
  helm-version:
    description: Helm version to install when Helm is unavailable or mismatched
    required: false
    default: '4.2.4'
  shfmt-version:
    description: shfmt release version to install when shfmt is unavailable
    required: false
    default: '3.13.1'
  shellcheck-version:
    description: shellcheck release version to install when shellcheck is unavailable
    required: false
    default: '0.11.0'
  kubectl-version:
    description: kubectl minor stream to install when kubectl is unavailable
    required: false
    default: '1.36.3'
  awscli-version:
    description: AWS CLI version to install when AWS CLI is unavailable or mismatched
    required: false
    default: '2.36.41'
  oc-version:
    description: OpenShift client version to install when oc is unavailable
    required: false
    default: '4.22.9'
runs:
  using: composite
  steps:
    - name: Install base packages
      shell: bash
      run: |
        set -euo pipefail
        echo 'setup-tools: checking base packages'
        missing=()
        for package in jq gettext-base libxml2-utils xz-utils; do
          case "$package" in
            jq) command_name=jq ;;
            gettext-base) command_name=envsubst ;;
            libxml2-utils) command_name=xmllint ;;
          esac
          command -v "$command_name" >/dev/null 2>&1 || missing+=("$package")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "setup-tools: installing base packages: ${missing[*]}"
          timeout 180s sudo apt-get update -o Acquire::Retries=2
          timeout 180s sudo apt-get install --no-install-recommends -y "${missing[@]}"
        else
          echo 'setup-tools: base packages already available'
        fi
        echo 'setup-tools: base packages complete'

    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking Helm ${HELM_VERSION}"
        if command -v helm >/dev/null 2>&1 && helm version --template '{{.Version}}' 2>/dev/null | grep -q "v${HELM_VERSION}$"; then
          echo 'setup-tools: Helm already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive="helm-v${HELM_VERSION}-linux-${arch}.tar.gz"
        echo "setup-tools: downloading ${archive}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://get.helm.sh/${archive}" --output "$RUNNER_TEMP/$archive"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/linux-${arch}/helm" /usr/local/bin/helm
        helm version
        echo 'setup-tools: Helm complete'

    - name: Install AWS CLI
      shell: bash
      env:
        AWSCLI_VERSION: ${{ inputs.awscli-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking AWS CLI ${AWSCLI_VERSION}"
        if command -v aws >/dev/null 2>&1 && aws --version 2>/dev/null | grep -q "aws-cli/${AWSCLI_VERSION//./\\.}"; then
          echo 'setup-tools: AWS CLI already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive="awscli-exe-linux-${arch}-${AWSCLI_VERSION}.zip"
        echo "setup-tools: downloading ${archive}"
        timeout 180s curl --fail --silent --show-error --location \
          "https://awscli.amazonaws.com/${archive}" --output "$RUNNER_TEMP/$archive"
        unzip -q -o "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/awscli"
        sudo "$RUNNER_TEMP/awscli/aws/install" --update
        aws --version
        echo 'setup-tools: AWS CLI complete'

    - name: Install shellcheck
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking ShellCheck ${SHELLCHECK_VERSION}"
        if command -v shellcheck >/dev/null 2>&1; then
          echo 'setup-tools: ShellCheck already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive="shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
        echo "setup-tools: downloading ${archive}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
          --output "$RUNNER_TEMP/$archive"
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        shellcheck --version | sed -n '1,2p'
        echo 'setup-tools: ShellCheck complete'

    - name: Install shfmt
      shell: bash
      env:
        SHFMT_VERSION: ${{ inputs.shfmt-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking shfmt ${SHFMT_VERSION}"
        if command -v shfmt >/dev/null 2>&1; then
          echo 'setup-tools: shfmt already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        echo "setup-tools: downloading shfmt for ${arch}"
        timeout 120s curl --fail --silent --show-error --location \
          "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_${arch}" \
          --output "$RUNNER_TEMP/shfmt"
        sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
        shfmt --version
        echo 'setup-tools: shfmt complete'

    - name: Install kubectl
      shell: bash
      env:
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking kubectl ${KUBECTL_VERSION}"
        if command -v kubectl >/dev/null 2>&1 && kubectl version --client=true --output=json 2>/dev/null | jq -e --arg v "v${KUBECTL_VERSION}" '.clientVersion.gitVersion == $v' >/dev/null; then
          echo 'setup-tools: kubectl already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        timeout 120s curl --fail --silent --show-error --location \
          "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${arch}/kubectl" \
          --output "$RUNNER_TEMP/kubectl"
        sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
        kubectl version --client=true
        echo 'setup-tools: kubectl complete'

    - name: Install OpenShift client
      shell: bash
      env:
        OC_VERSION: ${{ inputs.oc-version }}
      run: |
        set -euo pipefail
        echo "setup-tools: checking oc ${OC_VERSION}"
        if command -v oc >/dev/null 2>&1 && oc version --client=true 2>/dev/null | grep -q "Client Version: ${OC_VERSION}"; then
          echo 'setup-tools: oc already available'
          exit 0
        fi
        arch=$(uname -m)
        case "$arch" in
          x86_64) client_path='' ;;
          aarch64|arm64) client_path='aarch64/' ;;
          *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        archive='openshift-client-linux.tar.gz'
        base_url="https://mirror.openshift.com/pub/openshift-v4/${client_path}clients/ocp/${OC_VERSION}"
        timeout 180s curl --fail --silent --show-error --location \
          "${base_url}/${archive}" --output "$RUNNER_TEMP/$archive"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oc
        sudo install -m 0755 "$RUNNER_TEMP/oc" /usr/local/bin/oc
        oc version --client=true
        echo 'setup-tools: oc complete'

    - name: Report tool versions
      shell: bash
      run: |
        set -euo pipefail
        printf 'architecture=%s\n' "$(uname -m)"
        printf 'helm='; helm version --template '{{.Version}}'; printf '\n'
        printf 'shellcheck='; shellcheck --version | awk -F: '/version:/ {gsub(/ /, "", $2); print $2; exit}'
        printf 'shfmt='; shfmt --version
        printf 'jq='; jq --version
        printf 'python='; python3 --version
        printf 'aws='; aws --version
        printf 'kubectl='; kubectl version --client=true --output=json | jq -r '.clientVersion.gitVersion'
        printf 'oc='; oc version --client=true | sed -n '1p'
