{{- range (list "pingaccess-admin" "pingaccess-engine" "pingauthorize" "pingdatasync" "pingdirectory" "pingdirectoryproxy" "pingfederate-admin" "pingfederate-engine") }}
{{- $product := . }}
{{- $merged := mergeOverwrite (deepCopy $.Values.global) (index $.Values $product) }}
{{- if and $merged.secretProviderClass.enabled $merged.secretProviderClass.create }}
{{- if not ($.Capabilities.APIVersions.Has "secrets-store.csi.x-k8s.io/v1") }}
{{- fail (printf "SecretProviderClass API 'secrets-store.csi.x-k8s.io/v1' is not available in Capabilities.APIVersions. Install the Secrets Store CSI Driver CRDs before enabling secretProviderClass.create for product '%s'." $product) }}
{{- end }}
{{- $spcName := default (printf "%s-%s-spc" $.Release.Name $product) $merged.secretProviderClass.name }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  {{ include "pinglib.metadata.labels" (list $ $merged) | nindent 2 }}
  name: {{ $spcName }}
spec:
  provider: {{ $merged.secretProviderClass.provider }}
  {{- if $merged.secretProviderClass.parameters }}
  parameters:
    {{- toYaml $merged.secretProviderClass.parameters | nindent 4 }}
  {{- end }}
  {{- if $merged.secretProviderClass.secretObjects }}
  secretObjects:
    {{- toYaml $merged.secretProviderClass.secretObjects | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
